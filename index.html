<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0c1520" />
    <meta name="color-scheme" content="dark" />
    <title>Earth Pulse, Ahmedabad: NISAR evidence explorer</title>
    <meta
      name="description"
      content="Earth Pulse follows Sabarmati water, river margins and ground movement in Ahmedabad through NASA–ISRO NISAR radar, and shows when the evidence is not strong enough to conclude anything."
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Earth Pulse, Ahmedabad" />
    <meta property="og:description" content="One familiar city. Three forms of surface change. One NISAR evidence explorer." />
    <link rel="icon" type="image/svg+xml" href="/earth-pulse-icon.svg" />

    <!-- Embed mode keeps the original GlobeStudio transparent-iframe support. -->
    <style>
      html[data-embed-transparent],
      html[data-embed-transparent] body,
      html[data-embed-transparent] #root { background: transparent !important; }
    </style>
    <script>
      (function () {
        try {
          var p = location.pathname.replace(/\/+$/, "");
          if (!/(^|\/)embed$/.test(p)) return;
          var s = location.search;
          if (!/[?&]transparent=(1|true)\b/.test(s)) return;
          var de = document.documentElement;
          de.setAttribute("data-embed-transparent", "");
          de.style.background = "transparent";
        } catch (e) {}
      })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root { color-scheme: dark; --bg: #0c1520; --text: #eef4f7; }
      html, body { margin: 0; background: #0c1520; color: #eef4f7; }
      body { overflow: hidden; }
    </style>
  </head>
  <body>
    <div id="root">
      <noscript>
        <div style="font-family: system-ui, sans-serif; padding: 40px; max-width: 640px; margin: 0 auto; color: #eef4f7;">
          <h1>Earth Pulse, Ahmedabad</h1>
          <p>JavaScript and WebGL are required to run the globe and the NISAR evidence explorer.</p>
        </div>
      </noscript>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
